name: node checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o mboard-node ./cmd/mboard-node
